name: Bygg snøkart

on:
  schedule:
    # GFS-kjøringene (00, 06, 12, 18 UTC) er ferdig publisert etter ca. 5 timer.
    - cron: "25 5,11,17,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/build-snow.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/build-snow.yml"

# pages and id-token are granted only on the deploy job.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -v

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A pull-request test run must not cancel a scheduled publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Bilder, latest.json og regelsetninger. Ingen API-nøkkel i dette steget.
      - name: Bygg snøkart
        env:
          SNOWMAP_LIVE_AI_DAILY_CAP: ${{ vars.SNOWMAP_LIVE_AI_DAILY_CAP }}
        run: python scripts/build_snow.py --out site
      # Eget steg med kort tidsavbrudd. Dør det, ligger regelfilen allerede i site/.
      - name: AI-setninger
        continue-on-error: true
        timeout-minutes: 3
        env:
          SNOWMAP_AI_API_KEY: ${{ secrets.SNOWMAP_AI_API_KEY }}
          SNOWMAP_AI_BASE_URL: ${{ vars.SNOWMAP_AI_BASE_URL }}
          SNOWMAP_AI_MODEL: ${{ vars.SNOWMAP_AI_MODEL }}
          SNOWMAP_AI_MAX_CALLS: ${{ vars.SNOWMAP_AI_MAX_CALLS }}
          SNOWMAP_LIVE_AI_DAILY_CAP: ${{ vars.SNOWMAP_LIVE_AI_DAILY_CAP }}
        run: python scripts/snow_sentences.py --sentences site/snow/ai_sentences.json --inputs build/sentence_inputs.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

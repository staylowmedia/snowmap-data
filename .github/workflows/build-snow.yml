name: Bygg snøkart

on:
  schedule:
    # GFS-kjøringene (00, 06, 12, 18 UTC) er ferdig publisert etter ca. 5 timer.
    - cron: "25 5,11,17,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build-snow.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test snøsetninger
        run: PYTHONPATH=scripts python -m unittest discover -s tests -v
      # Nøkkelen er en Actions-hemmelighet og skal aldri skrives til loggen.
      # Uten nøkkel, eller uten URL og modell, brukes bare regeltekst.
      - name: Bygg snøkart
        env:
          SNOWMAP_AI_API_KEY: ${{ secrets.SNOWMAP_AI_API_KEY }}
          SNOWMAP_AI_BASE_URL: ${{ vars.SNOWMAP_AI_BASE_URL }}
          SNOWMAP_AI_MODEL: ${{ vars.SNOWMAP_AI_MODEL }}
          SNOWMAP_AI_MAX_CALLS: ${{ vars.SNOWMAP_AI_MAX_CALLS }}
          # Tom verdi: skriptet skriver app_config.live_ai_daily_cap = 5.
          SNOWMAP_LIVE_AI_DAILY_CAP: ${{ vars.SNOWMAP_LIVE_AI_DAILY_CAP }}
        run: python scripts/build_snow.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
